name: IPO verdict monitor
on:
  schedule:
    # UTC -> IST: 15:02, 15:12, 15:22, weekdays.
    - cron: '32,42,52 9 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview fetches live data; send respects the IST delivery window.
        type: choice
        options: [preview, send]
        default: preview
permissions:
  contents: write
concurrency:
  group: ipo-verdict-delivery
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Fetch and assess IPOs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          STATE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
        shell: bash
        run: |
          if [ "$RUN_MODE" = "send" ]; then
            python monitor.py --send
          else
            python monitor.py
          fi
      - name: Show assessment in run summary
        if: always()
        shell: bash
        run: |
          if [ -f report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open('report.json'))
          print('```text')
          print('Assessed:', r['assessed_at'])
          for i in r['issues']:
              print(i['message'])
              print('Delivery:', i['delivery'], '\n')
          for e in r['errors']:
              print('Data error:', e)
          if not r['issues']:
              print('No mainboard IPOs closing today found.')
          print('```')
          PY
          fi
